# 发布到 npm registry。
# 认证方式：npm Trusted Publishing（OIDC），不需要长期 npm token。
# 触发方式：推送 v* tag（例如 v0.2.2）。推送 tag 后会自动测试、发布 npm，并创建 GitHub Release。
name: Node.js Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      # Trusted Publishing 要求 npm >= 11.5.1；这里统一升到 11.15+。
      - run: npm install -g npm@^11.15.0
      - run: npm install --ignore-scripts
      - run: npm publish --access public

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
