# 当创建 GitHub Release 时，验证包语法并发布到 npm registry。
# 触发方式：仓库 Releases → Draft a new release → 选择/新建 tag → Publish release。
name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm install --ignore-scripts
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
